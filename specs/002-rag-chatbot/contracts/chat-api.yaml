openapi: 3.0.3
info:
  title: RAG Chatbot API
  description: API for the Physical AI & Humanoid Robotics book RAG chatbot
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://your-backend-domain.com
    description: Production server

paths:
  /api/chat:
    post:
      summary: Send a message to the RAG chatbot
      description: Submit a query to the chatbot and receive a response based on book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/ingest:
    post:
      summary: Ingest documents for RAG
      description: Process and index book content for retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestRequest'
      responses:
        '200':
          description: Documents successfully ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
        '400':
          description: Invalid document format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/stats:
    get:
      summary: Get document statistics
      description: Retrieve statistics about indexed documents
      responses:
        '200':
          description: Document statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health:
    get:
      summary: Health check
      description: Check if the service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user's question/query
          example: "Explain ROS 2 nodes and topics"
        context:
          type: string
          description: Additional context from selected text (optional)
          example: "A node is a process that performs computation..."
        conversation_id:
          type: string
          description: ID of the conversation for continuity (optional)
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        temperature:
          type: number
          description: Creativity control for response (0.0-1.0)
          default: 0.7
          example: 0.5

    ChatResponse:
      type: object
      required:
        - answer
        - citations
        - conversation_id
      properties:
        answer:
          type: string
          description: The chatbot's response
          example: "ROS 2 nodes are the fundamental units of a ROS system..."
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          description: Sources used in the response
        conversation_id:
          type: string
          description: ID of the conversation
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        tokens_used:
          type: integer
          description: Number of tokens in the response
          example: 150
        processing_time:
          type: number
          description: Time taken to process the query in seconds
          example: 1.23

    Citation:
      type: object
      required:
        - document_id
        - source
        - text_snippet
      properties:
        document_id:
          type: string
          description: ID of the source document chunk
          example: "doc-123-chunk-456"
        source:
          type: string
          description: Source reference (chapter/page)
          example: "docs/ros2/basics.md#nodes-and-topics"
        text_snippet:
          type: string
          description: Relevant text snippet from the source
          example: "Nodes are the fundamental units of a ROS system..."

    DocumentIngestRequest:
      type: object
      required:
        - source_path
      properties:
        source_path:
          type: string
          description: Path to the documents to be ingested
          example: "../website/docs"
        force_refresh:
          type: boolean
          description: Whether to reprocess documents even if already indexed
          default: false

    DocumentIngestResponse:
      type: object
      required:
        - processed_count
        - indexed_count
        - skipped_count
      properties:
        processed_count:
          type: integer
          description: Number of documents processed
          example: 25
        indexed_count:
          type: integer
          description: Number of documents successfully indexed
          example: 25
        skipped_count:
          type: integer
          description: Number of documents skipped (already indexed)
          example: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/IngestDetail'

    IngestDetail:
      type: object
      required:
        - document_path
        - status
      properties:
        document_path:
          type: string
          description: Path of the processed document
          example: "docs/ros2/basics.md"
        status:
          type: string
          description: Processing status
          enum: [success, skipped, error]
          example: "success"
        message:
          type: string
          description: Additional information about processing
          example: "Document indexed successfully"

    DocumentStatsResponse:
      type: object
      required:
        - total_documents
        - total_chunks
        - last_ingestion_date
      properties:
        total_documents:
          type: integer
          description: Total number of indexed documents
          example: 15
        total_chunks:
          type: integer
          description: Total number of indexed content chunks
          example: 342
        last_ingestion_date:
          type: string
          format: date-time
          description: Last date when documents were ingested
          example: "2025-12-15T10:30:00Z"
        indexed_sources:
          type: array
          items:
            type: string
          description: List of indexed source documents
          example: ["docs/intro/getting-started.md", "docs/ros2/basics.md"]

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          description: Health status
          enum: [healthy, degraded, unavailable]
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
          example: "2025-12-15T10:30:00Z"
        services:
          type: object
          description: Status of dependent services
          properties:
            vector_db:
              type: string
              enum: [connected, disconnected]
              example: "connected"
            llm_api:
              type: string
              enum: [available, unavailable]
              example: "available"
            metadata_db:
              type: string
              enum: [connected, disconnected]
              example: "connected"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type
          example: "invalid_input"
        message:
          type: string
          description: Detailed error message
          example: "Query must be between 1 and 1000 characters"
        details:
          type: object
          description: Additional error details
          example: {"field": "query", "code": "length_invalid"}